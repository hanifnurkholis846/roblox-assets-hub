<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxStore - Toko Aset Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== HTML ===== -->
<div class="container-all">
    <header class="header">
        <div class="container">
            <div class="logo">🎮 RobloxStore</div>
            <nav class="nav">
                <a href="#">Beranda</a>
                <a href="#">Aset</a>
                <a href="#">Tentang</a>
                <a href="#">Kontak</a>
            </nav>
        </div>
    </header>

    <section class="banner">
        <div class="container">
            <h1>🏪 Toko Aset Roblox</h1>
            <p>Temukan model, texture, script, dan plugin keren buat game-mu!</p>
            <p class="sub">✨ Ada yang gratis & berbayar ✨</p>
        </div>
    </section>

    <section class="produk">
        <div class="container">
            <div class="toolbar">
                <h2>🔥 Koleksi Aset</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Cari aset..." oninput="searchAset()">
                </div>
            </div>
            
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="free" onclick="switchTab('free')">
                    🆓 Free <span class="badge" id="badge-free">0</span>
                </button>
                <button class="tab-btn" data-tab="paid" onclick="switchTab('paid')">
                    💰 Paid <span class="badge" id="badge-paid">0</span>
                </button>
                <button class="tab-btn" data-tab="plugin" onclick="switchTab('plugin')">
                    🔌 Plugin <span class="badge" id="badge-plugin">0</span>
                </button>
            </div>

            <div class="tab-content">
                <div id="tab-free" class="tab-panel active">
                    <div class="grid" id="daftarFree"></div>
                </div>
                <div id="tab-paid" class="tab-panel">
                    <div class="grid" id="daftarPaid"></div>
                </div>
                <div id="tab-plugin" class="tab-panel">
                    <div class="grid" id="daftarPlugin"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>© 2026 RobloxStore - Dibuat dengan ❤️</p>
        </div>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
